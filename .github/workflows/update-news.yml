name: roz news update

# GitHub Actions UTC me chalata hai. IST = UTC + 5:30
# 07:00 IST = 01:30 UTC | 13:00 IST = 07:30 UTC | 19:00 IST = 13:30 UTC
on:
  schedule:
    - cron: '30 1,7,13 * * *'
  workflow_dispatch:   # manually bhi chalaya ja sakta hai

permissions:
  contents: write      # GitHub ka apna automatic token — koi personal token nahi

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Khabre laakar pages banao
        env:
          SITE_NAME: खबर संसार
          SITE_URL: https://chapagaimonoj-ux.github.io/Hindi-News
        run: python3 scripts/fetch_news.py

      - name: Badlaav commit aur push karo
        run: |
          git config user.name "News Bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Koi nayi khabar nahi — push skip."
          else
            git commit -m "News update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main
            echo "PUSH OK"
          fi
